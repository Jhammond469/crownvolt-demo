  <style>
    :root { --ink: #0B0D16; --card: #151826; --gold: #D9AF3E; --line: rgba(255,255,255,.1); --fog: #B9B9BF; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(120% 70% at 50% 0%, #2a2412 0%, var(--ink) 60%); color: #fff; font: 16px/1.5 'Open Sans', system-ui, sans-serif; }
    .card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px 22px 22px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
    .logo { width: 180px; height: auto; margin: 0 auto 14px; display: block; }
    h1 { font: 800 26px/1.15 Montserrat, sans-serif; letter-spacing: -.02em; }
    .role { color: var(--gold); font: 700 12px Montserrat, sans-serif; letter-spacing: .14em; text-transform: uppercase; margin: 8px 0 4px; }
    .lic { color: var(--fog); font-size: 13px; }
    .save { display: block; margin: 22px 0 12px; padding: 17px; border-radius: 999px; background: var(--gold); color: var(--ink); font: 800 17px Montserrat, sans-serif; text-decoration: none; box-shadow: 0 0 0 6px rgba(217,175,62,.15); }
    .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .row a { padding: 13px 6px; border-radius: 14px; border: 1px solid var(--line); color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; }
    .list { list-style: none; padding: 0; margin: 20px 0 0; text-align: left; border-top: 1px solid var(--line); }
    .list li { padding: 11px 2px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--fog); }
    .list b { color: #fff; font-weight: 600; display: block; }
    .list a { color: #fff; text-decoration: none; }
    .web { display: inline-block; margin-top: 18px; color: var(--gold); font-weight: 600; font-size: 14px; text-decoration: none; }
  </style>
</head>
