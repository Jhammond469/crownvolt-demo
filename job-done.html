<!-- CrownVolt internal tool — NOT part of the public site. No nav link, disallowed in
     robots.txt. This is the "job complete" trigger for the review-request automation:
     Lucas opens it on his phone after a job, types the customer's first name + mobile,
     and n8n texts them a Google review link 2 hours later.

     Chosen over hooking into an invoicing app on purpose — per Syntra's earlier attempts,
     clients refused to connect automations to their accounting software. This needs no
     third-party access at all.

     BEFORE GOING LIVE: set SHARED_TOKEN below to match the token in the n8n workflow
     "CrownVolt - Review Request". The token is visible in page source, so it is obscurity
     plus a shared secret, not real authentication — it stops drive-by abuse of a public
     URL. Actual spend is capped by the Kudosity credit balance. If this ever gets abused,
     move the trigger behind a real login. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Job Done — CrownVolt</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0B0D16" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0B0D16;color:#fff;font-family:'Open Sans',system-ui,sans-serif;min-height:100vh;padding:24px 18px 48px;-webkit-font-smoothing:antialiased}
    .wrap{max-width:460px;margin:0 auto}
    .logo{display:block;height:54px;width:auto;margin:8px auto 28px}
    h1{font-family:'Montserrat',sans-serif;font-size:1.45rem;font-weight:800;text-align:center;letter-spacing:-.01em}
    .sub{text-align:center;color:#9aa1b4;font-size:.92rem;margin:8px 0 28px;line-height:1.5}
    label{display:block;font-family:'Montserrat',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#D9AF3E;margin:0 0 8px}
    input{width:100%;padding:16px 15px;font-size:1.05rem;font-family:inherit;color:#fff;background:#151826;border:1px solid #2a2f42;border-radius:12px;outline:none}
    input:focus{border-color:#D9AF3E}
    .field{margin-bottom:20px}
    button{width:100%;padding:18px;font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#0B0D16;background:#D9AF3E;border:0;border-radius:12px;cursor:pointer;margin-top:6px}
    button:disabled{opacity:.55;cursor:not-allowed}
    .msg{display:none;margin-top:20px;padding:15px;border-radius:12px;font-size:.94rem;line-height:1.5}
    .msg.show{display:block}
    .ok{background:rgba(46,160,90,.14);border:1px solid rgba(46,160,90,.5);color:#7ee0a5}
    .bad{background:rgba(200,50,40,.14);border:1px solid rgba(200,50,40,.5);color:#ff9a90}
    .note{margin-top:26px;color:#6f7689;font-size:.8rem;text-align:center;line-height:1.6}
    /* Share in person: business card + review link, each as a QR code or a text from Lucas's own phone */
    .share{margin-top:34px;padding-top:26px;border-top:1px solid #2a2f42}
    .share h2{font-family:'Montserrat',sans-serif;font-size:1.05rem;font-weight:800;text-align:center}
    .qcs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    .qcs .qc{margin:0;padding:16px 10px;text-transform:none;letter-spacing:0;font-size:.95rem;color:#fff;background:#151826;border:1px solid #2a2f42;display:grid;gap:4px;justify-items:center}
    .qcs .qc small{font-family:'Open Sans',sans-serif;font-weight:400;font-size:.78rem;color:#9aa1b4}
    .qcs .qc b{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#D9AF3E;color:#0B0D16;font-size:1rem;margin-bottom:2px}
    dialog.sheet{border:0;padding:0;background:transparent;color:#fff;width:calc(100% - 20px);max-width:460px;margin:auto auto 10px}
    dialog.sheet::backdrop{background:rgba(5,6,12,.75);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
    .sheet-in{background:#11131f;border:1px solid #2a2f42;border-radius:24px;padding:24px 18px calc(18px + env(safe-area-inset-bottom));position:relative}
    .sheet-in h3{font-family:'Montserrat',sans-serif;font-size:1.2rem;font-weight:800;padding-right:44px}
    .sheet-in .sub{text-align:left;margin:6px 0 14px}
    .sheet .x{position:absolute;top:12px;right:12px;width:40px;height:40px;margin:0;padding:0;border-radius:50%;background:transparent;border:1px solid #2a2f42;color:#9aa1b4;font-size:.9rem}
    .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;background:#151826;border:1px solid #2a2f42;margin-bottom:16px}
    .seg[hidden],.mode[hidden],[data-qr][hidden]{display:none}
    .seg button{margin:0;padding:11px 6px;border-radius:999px;background:transparent;color:#fff;text-transform:none;letter-spacing:0;font-size:.9rem}
    .seg button.on{background:#D9AF3E;color:#0B0D16}
    .qr-mode{text-align:center}
    .qr-box{background:#fff;border-radius:22px;padding:14px;width:min(250px,68vw);margin:4px auto 10px;box-shadow:0 0 0 6px rgba(217,175,62,.14),0 0 40px rgba(217,175,62,.3)}
    .qr-svg{display:block;width:100%;height:auto}
    .preview{white-space:pre-wrap;font-size:.86rem;line-height:1.5;color:#9aa1b4;border:1px dashed #2a2f42;border-radius:12px;padding:12px 14px;margin-bottom:6px}
    .alt{background:transparent;border:1px solid #2a2f42;color:#fff}
  </style>
</head>
<body>
  <div class="wrap">
    <img src="logo.png" alt="CrownVolt Electrical" class="logo" />
    <h1>Job Done</h1>
    <p class="sub">Send this customer a Google review request.<br />They'll get a text 2 hours from now.</p>

    <form id="jobForm" autocomplete="off">
      <div class="field">
        <label for="cname">Customer First Name</label>
        <input type="text" id="cname" name="customer_name" placeholder="Sarah" required />
      </div>
      <div class="field">
        <label for="cphone">Mobile Number</label>
        <input type="tel" id="cphone" name="customer_phone" inputmode="numeric" placeholder="0412 345 678" required />
      </div>
      <button type="submit" id="btn">Send Review Request</button>
    </form>

    <div class="msg ok"  id="ok">Done. <span id="okName">They</span> will get the review text in 2 hours.</div>
    <div class="msg bad" id="bad"><span id="badText">Something went wrong. Try again, or check with Josh.</span></div>

    <section class="share">
      <h2>Share in person</h2>
      <div class="qcs">
        <button type="button" class="qc" data-share="card"><b>✆</b>Send my card<small>QR code or a text</small></button>
        <button type="button" class="qc" data-share="review"><b>★</b>Review QR code<small>They scan, then review</small></button>
      </div>
    </section>

    <p class="note">Add this page to your home screen so it's one tap after every job.</p>
  </div>

  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <div class="sheet-in">
      <button type="button" class="x" id="sheetX" aria-label="Close">✕</button>
      <h3 id="sheetTitle">Send my card</h3>
      <p class="sub" id="sheetSub"></p>
      <div class="seg" id="seg"><button type="button" data-mode="qr">Show QR code</button><button type="button" data-mode="text">Text it</button></div>
      <div class="mode qr-mode" id="qrMode">
        <div class="qr-box"><div data-qr="card"><svg role="img" aria-label="QR code" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 33 33" class="qr-svg"><path fill="#fff" d="M0 0h33v33h-33z"/><path stroke="#0d0d0d" d="M2 2.5h7m4 0h1m2 0h1m2 0h1m1 0h2m1 0h7m-29 1h1m5 0h1m1 0h1m1 0h1m2 0h1m1 0h2m1 0h1m3 0h1m5 0h1m-29 1h1m1 0h3m1 0h1m1 0h5m2 0h2m1 0h2m2 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m4 0h2m3 0h2m4 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m2 0h1m1 0h2m1 0h1m1 0h4m2 0h1m1 0h3m1 0h1m-29 1h1m5 0h1m2 0h1m1 0h3m3 0h1m1 0h1m2 0h1m5 0h1m-29 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-19 1h3m1 0h1m1 0h2m1 0h2m-20 1h3m1 0h2m2 0h1m2 0h1m2 0h1m1 0h3m6 0h2m-27 1h3m3 0h1m4 0h1m2 0h2m1 0h9m1 0h1m-29 1h5m1 0h2m1 0h3m6 0h1m3 0h3m2 0h1m-28 1h1m1 0h1m1 0h1m2 0h4m1 0h2m2 0h1m1 0h1m4 0h2m3 0h1m-29 1h1m2 0h7m1 0h1m1 0h2m1 0h2m2 0h2m1 0h1m2 0h3m-29 1h1m12 0h1m2 0h2m1 0h1m2 0h2m1 0h2m1 0h1m-29 1h3m3 0h1m2 0h1m1 0h3m4 0h3m1 0h4m2 0h1m-24 1h1m6 0h2m2 0h1m1 0h2m4 0h2m1 0h1m-27 1h1m3 0h3m1 0h4m2 0h3m2 0h2m1 0h3m1 0h1m-26 1h2m1 0h1m1 0h1m1 0h1m1 0h3m2 0h2m2 0h2m3 0h1m-26 1h1m1 0h1m3 0h4m3 0h1m1 0h3m2 0h1m1 0h5m-25 1h1m1 0h2m1 0h1m1 0h2m2 0h2m2 0h1m1 0h1m1 0h2m1 0h4m-27 1h2m1 0h3m1 0h4m1 0h2m1 0h3m1 0h8m-20 1h1m7 0h1m3 0h1m3 0h2m2 0h1m-29 1h7m2 0h1m1 0h4m1 0h2m1 0h2m1 0h1m1 0h1m1 0h2m-28 1h1m5 0h1m1 0h2m1 0h1m1 0h3m4 0h1m3 0h1m3 0h1m-29 1h1m1 0h3m1 0h1m6 0h2m3 0h1m1 0h7m1 0h1m-29 1h1m1 0h3m1 0h1m1 0h1m2 0h1m1 0h2m1 0h2m1 0h1m4 0h2m1 0h1m-28 1h1m1 0h3m1 0h1m1 0h3m1 0h1m1 0h5m1 0h1m2 0h1m2 0h1m1 0h1m-29 1h1m5 0h1m1 0h1m1 0h3m3 0h1m1 0h1m1 0h1m3 0h2m1 0h1m-28 1h7m2 0h1m3 0h3m2 0h1m1 0h2m1 0h1m3 0h1"/></svg></div><div data-qr="review"><svg role="img" aria-label="QR code" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 33 33" class="qr-svg"><path fill="#fff" d="M0 0h33v33h-33z"/><path stroke="#0d0d0d" d="M2 2.5h7m1 0h1m3 0h1m1 0h1m2 0h2m3 0h7m-29 1h1m5 0h1m1 0h1m1 0h5m4 0h2m1 0h1m5 0h1m-29 1h1m1 0h3m1 0h1m1 0h1m1 0h1m2 0h2m3 0h1m3 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m4 0h1m1 0h1m3 0h2m1 0h1m1 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m2 0h1m2 0h1m1 0h3m1 0h1m-29 1h1m5 0h1m2 0h2m1 0h1m1 0h1m2 0h2m1 0h1m1 0h1m5 0h1m-29 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-20 1h2m2 0h1m2 0h1m1 0h3m-21 1h1m2 0h7m2 0h1m1 0h3m2 0h1m1 0h1m2 0h1m1 0h3m-29 1h1m1 0h3m4 0h2m1 0h1m2 0h1m2 0h2m3 0h2m1 0h2m-25 1h1m1 0h2m1 0h4m1 0h1m1 0h1m1 0h1m2 0h1m3 0h1m1 0h1m-27 1h6m6 0h1m1 0h4m1 0h3m1 0h3m2 0h1m-29 1h2m1 0h1m2 0h5m1 0h4m3 0h1m2 0h2m4 0h1m-28 1h1m5 0h1m3 0h8m1 0h1m1 0h7m-29 1h3m3 0h1m1 0h1m1 0h4m1 0h1m1 0h1m1 0h1m2 0h1m1 0h1m1 0h1m1 0h1m-29 1h1m2 0h2m2 0h3m2 0h1m1 0h2m2 0h5m1 0h1m1 0h1m1 0h1m-29 1h1m3 0h5m2 0h1m2 0h1m2 0h1m2 0h2m3 0h1m-26 1h1m3 0h1m3 0h1m1 0h1m1 0h2m1 0h2m1 0h3m3 0h1m1 0h2m-28 1h2m2 0h1m1 0h5m1 0h1m2 0h1m3 0h1m3 0h1m1 0h1m2 0h1m-29 1h2m3 0h1m3 0h3m2 0h1m1 0h1m3 0h4m1 0h2m-27 1h2m2 0h1m1 0h1m1 0h1m4 0h2m1 0h2m1 0h9m-20 1h1m1 0h1m1 0h1m1 0h1m2 0h2m1 0h1m3 0h2m-26 1h7m1 0h1m1 0h2m2 0h2m2 0h1m1 0h1m1 0h1m1 0h2m-26 1h1m5 0h1m1 0h2m2 0h1m1 0h7m3 0h1m2 0h1m-28 1h1m1 0h3m1 0h1m1 0h2m1 0h1m1 0h4m2 0h7m2 0h1m-29 1h1m1 0h3m1 0h1m1 0h1m1 0h1m1 0h1m3 0h1m4 0h1m6 0h1m-29 1h1m1 0h3m1 0h1m3 0h1m4 0h1m2 0h1m1 0h1m3 0h1m1 0h3m-29 1h1m5 0h1m2 0h1m1 0h1m1 0h1m8 0h2m1 0h2m1 0h1m-29 1h7m1 0h2m1 0h1m1 0h3m1 0h1m2 0h3m1 0h1"/></svg></div></div>
        <p class="sub" id="qrNote" style="text-align:center"></p>
        <button type="button" id="qrShare">Share the link</button>
        <button type="button" class="alt" id="qrCopy">Copy link</button>
      </div>
      <form class="mode" id="textMode" autocomplete="off" novalidate>
        <div class="field"><label for="tname">Their name</label><input id="tname" autocapitalize="words" placeholder="Dave" /></div>
        <div class="field"><label for="tphone">Their mobile</label><input id="tphone" type="tel" inputmode="tel" placeholder="0412 345 678" /></div>
        <div class="preview" id="preview"></div>
        <div class="msg bad" id="tbad"></div>
        <button type="submit">Open text message</button>
      </form>
    </div>
  </dialog>

<script>
  // Share in person. Card link = crownvolt.com.au/card (a page with Save to contacts -> lucas.vcf).
  // Review link = the one verified from his Business Profile (same as index.html + the n8n workflow).
  (function () {
    var SHARE = {
      card: { url: 'https://crownvolt.com.au/card', title: 'Send my card', sub: 'Show the code, or text it from your phone.',
              note: 'Point their phone camera at the code. Your details open, ready to save.',
              text: "Hi {first}, Lucas from CrownVolt Electrical, good to meet you. Tap to save my details:\n{link}\n\nLicensed electrician for homes, businesses, switchboards, hot water and lighting across South East QLD. Call or text 0430 064 848 any time.\nCheers, Lucas" },
      review: { url: 'https://g.page/r/Cb6abd8EnOjqEBM/review', title: 'Review QR code', sub: 'For when you are standing with the customer.',
              note: 'Point their phone camera at the code. Google opens the review box (they may need to sign in).' }
    };
    var $ = function (id) { return document.getElementById(id); };
    var sheet = $('sheet'), key = 'card', isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var first = function (n) { return (String(n).trim().split(/\s+/)[0] || 'there').replace(/^./, function (c) { return c.toUpperCase(); }); };
    var body = function () { return SHARE.card.text.replace('{first}', first($('tname').value)).replace('{link}', SHARE.card.url); };
    function mode(m) {
      [].forEach.call($('seg').querySelectorAll('button'), function (b) { b.classList.toggle('on', b.getAttribute('data-mode') === m); });
      $('qrMode').hidden = m !== 'qr'; $('textMode').hidden = m !== 'text';
      if (m === 'text') $('preview').textContent = body();
    }
    [].forEach.call(document.querySelectorAll('[data-share]'), function (b) {
      b.addEventListener('click', function () {
        key = b.getAttribute('data-share'); var x = SHARE[key];
        $('sheetTitle').textContent = x.title; $('sheetSub').textContent = x.sub; $('qrNote').textContent = x.note;
        [].forEach.call(document.querySelectorAll('[data-qr]'), function (q) { q.hidden = q.getAttribute('data-qr') !== key; });
        $('seg').hidden = key !== 'card'; $('qrShare').textContent = navigator.share ? 'Share the link' : 'Open the link'; $('qrCopy').textContent = 'Copy link';
        $('textMode').reset(); $('tbad').classList.remove('show'); mode('qr');
        sheet.showModal();
      });
    });
    $('seg').addEventListener('click', function (e) { var b = e.target.closest('[data-mode]'); if (b) mode(b.getAttribute('data-mode')); });
    $('textMode').addEventListener('input', function () { $('preview').textContent = body(); });
    $('textMode').addEventListener('submit', function (e) {
      e.preventDefault();
      var digits = $('tphone').value.replace(/[^0-9+]/g, '');
      if (digits.replace('+', '').length < 8) { $('tbad').textContent = 'Check the mobile number.'; $('tbad').classList.add('show'); return; }
      $('tbad').classList.remove('show');
      location.href = 'sms:' + digits + (isIOS ? '&' : '?') + 'body=' + encodeURIComponent(body());
    });
    $('qrShare').addEventListener('click', function () {
      var x = SHARE[key];
      if (navigator.share) navigator.share({ title: key === 'card' ? 'Lucas, CrownVolt Electrical' : 'Review CrownVolt on Google', url: x.url }).catch(function () {});
      else window.open(x.url, '_blank', 'noopener');
    });
    $('qrCopy').addEventListener('click', function () {
      navigator.clipboard.writeText(SHARE[key].url).then(function () { $('qrCopy').textContent = 'Copied ✓'; }, function () { $('qrCopy').textContent = 'Couldn’t copy'; });
    });
    $('sheetX').addEventListener('click', function () { sheet.close(); });
    sheet.addEventListener('click', function (e) { if (e.target === sheet) sheet.close(); });
  })();

  // Must match SHARED_TOKEN in the n8n workflow "CrownVolt - Review Request".
  var SHARED_TOKEN = 'cv-azt06f8s0jetybxjfewlc9sq';
  var WEBHOOK = 'https://jhammond.app.n8n.cloud/webhook/crownvolt-review-request';

  var form = document.getElementById('jobForm'),
      btn  = document.getElementById('btn'),
      ok   = document.getElementById('ok'),
      bad  = document.getElementById('bad');

  // Same AU mobile rule the n8n workflow enforces — catch it here so Lucas gets an
  // instant answer instead of a silent server-side rejection he never sees.
  function normalise(v) {
    var r = String(v || '').replace(/[^0-9+]/g, '');
    if (/^\+614\d{8}$/.test(r)) return r;
    if (/^614\d{8}$/.test(r))   return '+' + r;
    if (/^04\d{8}$/.test(r))    return '+61' + r.slice(1);
    if (/^4\d{8}$/.test(r))     return '+61' + r;
    return null;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    ok.classList.remove('show'); bad.classList.remove('show');

    var name  = document.getElementById('cname').value.trim();
    var phone = normalise(document.getElementById('cphone').value);

    if (!phone) {
      document.getElementById('badText').textContent =
        "That doesn't look like an Australian mobile. It should start with 04.";
      bad.classList.add('show');
      return;
    }

    btn.disabled = true; btn.textContent = 'Sending…';

    fetch(WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: SHARED_TOKEN, customer_name: name, customer_phone: phone })
    })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      document.getElementById('okName').textContent = name || 'They';
      ok.classList.add('show');
      form.reset();
    })
    .catch(function () {
      document.getElementById('badText').textContent =
        'Could not send. Check your signal and try again — nothing was sent to the customer.';
      bad.classList.add('show');
    })
    .finally(function () {
      btn.disabled = false; btn.textContent = 'Send Review Request';
    });
  });
</script>
</body>
</html>
